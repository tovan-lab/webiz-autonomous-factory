version: '3.9'
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webiz_test
      POSTGRES_PASSWORD: webiz_ephemeral_test_only
      POSTGRES_DB: webiz_test_db
    ports:
      - "54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webiz_test -d webiz_test_db"]
      interval: 3s
      timeout: 3s
      retries: 5
